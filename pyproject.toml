[project]
name = "bslm"
version = "0.0.1"
description = "Adapting Qwen3-1.7B-Base to Bambara (bam): data pipeline, alignment, CPT and SFT"
requires-python = ">=3.10"
dependencies = [
    "huggingface_hub>=0.30",
    "datasets>=3.0",
    "pydantic>=2.7",
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "requests>=2.32",
]

[project.optional-dependencies]
data = ["datasketch>=1.6", "sacrebleu>=2.4", "transformers>=4.51", "sentencepiece>=0.2"]
train = ["torch", "transformers>=4.51", "peft", "trl", "accelerate"]
mlx = ["mlx-lm"]
dev = ["pytest>=8"]

[project.scripts]
bslm = "bslm.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bslm"]
