# SFT data v3 (docs/v3_conversation_guide.md, PROVENANCE.md "v3 sources"). Changes vs v2 (configs/sft_v2.yaml):
#  - bayelemabaga + jeli_asr without the 45k cap; djelia bam-fr-en pairs (tgt_lang_p >= 0.9, 3% md5 val split)
#  - back-translation (bslm.v3data.generate): Bambara side real, fr/en model output -> fr->bam / en->bam ONLY
#  - 5,000 Claude-written Bambara conversations (owner: use all), 5% held out per category -> chat_valid.jsonl
#  - ~25k stitched multi-turn conversations chained from existing single-turn train rows (+300 from val rows)
#  - informal spelling extended with the reverse orthography table (ò, dy, French place names)
#  - synthetic cap 0.35 that drops pivot/BT rows only; final decontamination against eval sets + FLORES-200
#  - EXCLUDED: flores_dev / sib200 (FLORES dev+devtest sentences), MAFAND (test-only licence), the oasst2/dolly
#    chat translations (generated/chat_bam_filtered.jsonl, poor quality), smoltalk (Llama/GPT-4 outputs)
# Build: python -m bslm.cli build-sft --config configs/sft_v3.yaml   -> data/sft_v3/
version: 3
seed: 13
out_dir: data/sft_v3
system_prompt: "I ye dɛmɛbaga ye min bɛ bamanankan, faransikan ani angilɛkan fɔ."
system_prompt_share: 0.5
informal_spelling:             # French-style spelling on 15% of rows with Bambara input (Bambara text only)
  share: 0.15
  orthography_map: data/interim/v3/orthography_map.json
synthetic_cap: 0.35            # pivot + BT + conversations + QA; only pivot/BT rows are dropped to meet it

parallel:                      # every pair is used in both directions (bam->X and X->bam)
  - name: bayelemabaga_jeli
    files: {train: data/train/parallel_train.jsonl, val: data/train/parallel_val.jsonl}
    sources: [bayelemabaga, jeli_asr]
    tgt_lang: fr
    min_align_score: 0.4       # no pair cap in v3
  - name: djelia               # djelia/bambara-mt-dataset (CC-BY-SA-4.0), already deduped vs train/CPT + decontaminated
    files:
      train: {file: data/interim/v3/djelia_mt.jsonl, md5_split: train, md5_val_fraction: 0.03}
      val: {file: data/interim/v3/djelia_mt.jsonl, md5_split: val, md5_val_fraction: 0.03}
    tgt_lang: [fr, en]
    min_tgt_lang_p: 0.9
    strip_list_markers: true   # "- [ ] ", "- B. " artefacts from the source books
  - name: smol
    files: {train: {file: data/interim/smol_bam_en.jsonl, split: train}, val: {file: data/interim/smol_bam_en.jsonl, split: val}}
    sources: [smol_smolsent, smol_smoldoc]
    tgt_lang: en
  - name: gatitos
    files: {train: {file: data/interim/smol_bam_en.jsonl, split: train}, val: {file: data/interim/smol_bam_en.jsonl, split: val}}
    sources: [smol_gatitos]
    tgt_lang: en
    max_pairs: 2000
    max_val_pairs: 100
  - name: nllb_en
    files: {train: data/train/parallel_cpt_only_train.jsonl, val: data/train/parallel_cpt_only_val.jsonl}
    sources: [nllb_mined]
    tgt_lang: en
    min_align_score: 0.985
    min_words: 4
    max_len_ratio: 2.0
    strip_verse_numbers: true
    max_pairs: 10000
  - name: pivot_en             # synthetic (cap_droppable)
    files: {train: {file: data/interim/pivot_en.jsonl, split: train}, val: {file: data/interim/pivot_en.jsonl, split: val}}
    tgt_lang: en
    sources: [pivot:bayelemabaga, pivot:jeli_asr]
    synthetic: true
    min_words: 2
    max_len_ratio: 2.5
    max_pairs: 30000
    max_val_pairs: 1000

back_translation:              # synthetic (cap_droppable); train only
  name: bt
  file: data/interim/v3/generated/bt_out_filtered.jsonl
  langs: [fr, en]              # rows whose keep[lang] is true; direction lang->bam only

tasks:
  - name: qa_synthetic
    file: data/interim/qa_synthetic.jsonl
    synthetic: true
    accept: [accepted]
    repeat: 2

conversations:
  name: conv_v3
  file: data/interim/v3/conv_all.jsonl
  generator: claude-opus-5-5
  review: owner-approved
  val_fraction: 0.05           # per category, md5(id) -> data/sft_v3/chat_valid.jsonl, never in train
  repeat: 2

stitch:                        # multi-turn rows chained from single-turn rows (train rows only; n_val from val rows)
  n_train: 25000
  n_val: 300
  min_turns: 2
  max_turns: 4
  max_turn_chars: 1000
  max_chars: 2200              # whole conversation, keeps it under max_len 1024 tokens
  pools:                       # meta.source -> pool (human translations, Aya fr/en, reviewed QA)
    translation: [bayelemabaga_jeli, djelia, smol, gatitos, nllb_en]
    aya: [aya_dataset]
    qa: [qa_synthetic]
  weights: {translation: 0.72, aya: 0.24, qa: 0.04}

instructions:                  # several phrasings, in French, English and Bambara; {x} = source text
  bam-fr:
    - "Traduis en français : {x}"
    - "Translate into French: {x}"
    - "Nin bamanankan bayɛlɛma tubabukan na : {x}"
    - "Que veut dire cette phrase en français ? {x}"
    - "{x}\n\nEn français :"
  fr-bam:
    - "Traduis en bambara : {x}"
    - "Translate into Bambara: {x}"
    - "Nin tubabukan bayɛlɛma bamanankan na : {x}"
    - "Comment dit-on ceci en bambara ? {x}"
    - "{x}\n\nBamanankan na :"
  bam-en:
    - "Translate into English: {x}"
    - "Traduis en anglais : {x}"
    - "Nin bamanankan bayɛlɛma angilɛkan na : {x}"
    - "What does this Bambara sentence mean in English? {x}"
    - "{x}\n\nIn English:"
  en-bam:
    - "Translate into Bambara: {x}"
    - "Traduis en bambara : {x}"
    - "Nin angilɛkan bayɛlɛma bamanankan na : {x}"
    - "How do you say this in Bambara? {x}"
    - "{x}\n\nBamanankan na :"

replay:                        # French/English general instructions (human-written), as in v1
  source: CohereLabs/aya_dataset
  revision: f9ea04583f
  languages: [French, English]
  val_fraction: 0.02
  max_chars: 4000
  repeat: 2                    # only ~5.2k fr/en rows exist in Aya: shown twice (~10k)

raw_replay:                    # plain-text LM rows from the CPT mix (bam/fr/en), against forgetting
  file: data/cpt/with_nllb/train.jsonl
  share: 0.10                  # of the final train set
  max_chars: 1500
  min_chars: 200
