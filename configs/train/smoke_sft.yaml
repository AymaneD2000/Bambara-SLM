# Stage 0 smoke test, SFT part: chat format + prompt masking (brief §11). No quality conclusions.
model: Qwen/Qwen3-1.7B-Base
train: true
data: data/smoke/sft
fine_tune_type: lora
mask_prompt: true             # loss on assistant tokens only
num_layers: -1
lora_parameters:
  rank: 16
  scale: 20.0
  dropout: 0.0
  keys: [self_attn.q_proj, self_attn.k_proj, self_attn.v_proj, self_attn.o_proj, mlp.gate_proj, mlp.up_proj, mlp.down_proj]
batch_size: 4
grad_accumulation_steps: 1
iters: 150
learning_rate: 1.0e-4
max_seq_length: 512
grad_checkpoint: true
steps_per_report: 10
steps_per_eval: 50
val_batches: 25
save_every: 150
adapter_path: runs/smoke_sft
seed: 13
