# Stage 0 smoke test (brief §11): validates format, memory and the training loop on the Mac. No quality conclusions.
model: Qwen/Qwen3-1.7B-Base
train: true
data: data/smoke/cpt
fine_tune_type: lora
num_layers: -1                # all 28 layers
lora_parameters:
  rank: 16
  scale: 20.0
  dropout: 0.0
  keys: [self_attn.q_proj, self_attn.k_proj, self_attn.v_proj, self_attn.o_proj, mlp.gate_proj, mlp.up_proj, mlp.down_proj]
batch_size: 1
grad_accumulation_steps: 4
iters: 200
learning_rate: 1.0e-4
max_seq_length: 2048
grad_checkpoint: true
steps_per_report: 10
steps_per_eval: 50
val_batches: 25
save_every: 100
adapter_path: runs/smoke_cpt
seed: 13
